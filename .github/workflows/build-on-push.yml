name: Build APK (push to main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    name: assembleRelease (java / java32 / java64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # sdkmanager 需要 JDK 17+，先用 17 装 SDK 组件
      - name: Set up JDK 17 (SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;30.0.3" "build-tools;33.0.0" > /dev/null

      # AGP 7.2.2 / Gradle 7.5 用 JDK 11 构建
      - name: Set up JDK 11 (build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Patch build files (signing / version)
        run: |
          TAG="$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp -f .github/workflows/TVBoxOSC.jks app/tvbox.jks
          python3 .github/ci/patch_build.py "$TAG"
          grep -n "signingConfig\|versionName" app/build.gradle

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PRELEASE_STORE_FILE=tvbox.jks \
            -PRELEASE_STORE_PASSWORD=TVBoxOSC \
            -PRELEASE_KEY_ALIAS=TVBoxOSC \
            -PRELEASE_KEY_PASSWORD=TVBoxOSC \
            assembleJavaRelease assembleJava32Release assembleJava64Release

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} out/ \;
          cd out
          for f in *.apk; do mv "$f" "${f%.apk}-$TAG.apk"; done
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-apk-${{ env.TAG }}
          path: out/*.apk

      - name: Publish rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 最新构建 ${{ env.TAG }}
          prerelease: true
          body: |
            自动构建自 `${{ github.sha }}`
            提交：${{ github.event.head_commit.message }}
          files: out/*.apk
          fail_on_unmatched_files: true