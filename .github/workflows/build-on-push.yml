name: Build APK (push to main / yinzhou_test)

on:
  push:
    branches:
      - main
      - yinzhou_test
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleRelease (java / java32 / java64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # sdkmanager 需要 JDK 17+，先用 17 装 SDK 组件
      - name: Set up JDK 17 (SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK root: $SDKROOT"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            for d in "$SDKROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$d" ]; then SDKM="$d"; break; fi
            done
          fi
          echo "sdkmanager: $SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-33" "build-tools;30.0.3" "build-tools;33.0.0" > /dev/null
          "$SDKM" --list_installed | head -15

      # AGP 7.2.2 / Gradle 7.5 用 JDK 11 构建
      - name: Set up JDK 11 (build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Patch build files (signing / version)
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          if [ "$BRANCH" = "main" ]; then
            REL_TAG="latest-build"
          else
            REL_TAG="latest-build-${BRANCH//\//-}"
            TAG="${TAG}-${BRANCH//\//-}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "REL_TAG=$REL_TAG" >> "$GITHUB_ENV"
          echo "branch=$BRANCH tag=$TAG release=$REL_TAG"
          cp -f .github/workflows/TVBoxOSC.jks app/tvbox.jks
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          cat local.properties
          python3 .github/ci/patch_build.py "$TAG"
          grep -n "signingConfig\|versionName" app/build.gradle

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PRELEASE_STORE_FILE=tvbox.jks \
            -PRELEASE_STORE_PASSWORD=TVBoxOSC \
            -PRELEASE_KEY_ALIAS=TVBoxOSC \
            -PRELEASE_KEY_PASSWORD=TVBoxOSC \
            assembleJavaRelease assembleJava32Release assembleJava64Release

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} out/ \;
          cd out
          for f in *.apk; do mv "$f" "${f%.apk}-$TAG.apk"; done
          ls -lh

      - name: Verify APK signature
        run: |
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/33.0.0"
          for f in out/*.apk; do
            echo "=== $f"
            "$BT/apksigner" verify --print-certs "$f" | head -6
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-apk-${{ env.TAG }}
          path: out/*.apk

      - name: Clean old release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$REL_TAG" > /dev/null 2>&1; then
            gh release view "$REL_TAG" --json assets --jq '.assets[].name' | while read -r n; do
              echo "delete $n"
              gh release delete-asset "$REL_TAG" "$n" --yes || true
            done
          fi

      - name: Publish rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: 最新构建 ${{ env.TAG }}（${{ github.ref_name }}）
          prerelease: true
          body: |
            分支：`${{ github.ref_name }}`
            构建自 `${{ github.sha }}`
            提交：${{ github.event.head_commit.message }}
          files: out/*.apk
          fail_on_unmatched_files: true